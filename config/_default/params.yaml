# SITE SETUP
# Guide: https://docs.hugoblox.com/tutorial/
# Documentation: https://docs.hugoblox.com/
# This file is formatted using YAML syntax - learn more at https://learnxinyminutes.com/docs/yaml/

# Appearance
appearance:
  mode: system
  color: emerald

# SEO
marketing:
  seo:
    site_type: Person
    local_business_type: ''
    org_name: ''
    description: "Page personnelle de Pierrick Le Vourc'h."
    #twitter: 'GetResearchDev'
  analytics:
    google_analytics: ''
    baidu_tongji: ''
    plausible: ''
    fathom: ''
    pirsch: ''
  verification:
    google: 'NYUK3CYjJLRbdsDu8naAbxC5_adJWhLv6-8rm9MYcXg'
    baidu: ''

# Site header
header:
  navbar:
    enable: true
    blox: "navbar"
    fixed_to_top: true
    show_search: false
    show_translations: true
    hide_language_name: true
    show_theme_chooser: true
    highlight_active: true
    logo:
      text: "Pierrick Le Vourc'h"

# Site footer
footer:
  copyright:
    notice: "© {year} Pierrick Le Vourc'h."
    #license:
    #  enable: true
    #  allow_derivatives: false
    #  share_alike: true
    #  allow_commercial: false

# Localization
locale:
  date_format: 'Jan 2, 2006'
  time_format: '3:04 PM'

# Site features
features:
  math:
    enable: false
  privacy_pack:
    enable: false
  map:
    provider: 'mapnik'
    api_key: ''
    zoom: 15
  syntax_highlighter:
    theme_light: github-light
    theme_dark: dracula