# Navigation Links
#   To link a homepage widget, specify the URL as a hash `#` followed by the filename of the
  #     desired widget in your `content/home/` folder.
  #   The weight parameter defines the order that the links will appear in.

main:
  - name: Accueil et contact
    url: '#apropos'
    weight: 10
  - name: Publications
    url: publications/
    weight: 20
  - name: Enseignements
    url: enseignements/
    weight: 30
  - name: Exposés
    url: exposes/
    weight: 40
  - name: Documents
    url: documents/
    weight: 50
